# ADR-013 D4 — Prometheus scrape config. The scrape list is deliberately the
# three observability services ONLY: the databases are not scraped (no
# postgres_exporter — row counts are covered by Grafana's read-only Postgres
# datasource panels, ADR-013 D2a), and Kafka/Debezium have no JMX exporter
# wired. Pipeline metrics enter as Airflow application metrics via
# statsd-exporter (UDP fire-and-forget, ADR-013 D7).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/helios.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: statsd-exporter
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
