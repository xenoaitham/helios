# ADR-013 D2 — StatsD → Prometheus mapping for Airflow 2.10.5's NAME-ENCODED
# legacy metrics: plain statsd carries no tags (statsd_influxdb_enabled stays
# False — ADR-013 Context), so every pattern matches the name-encoded form
# that the airflow.metrics code deliberately emits alongside the tagged one.
# First match wins. Timers arrive in milliseconds; the exporter observes
# SECONDS. The exporter fails LOUDLY on unknown mapping keys — a typo here is
# a boot failure, never a silent misname (proven at boot: `timer_type` and
# `timers_type` are REJECTED on v0.31.0 — the field is `observer_type`, found
# by extracting the yaml struct tags from the pinned image's binary).
mappings:
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_task_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"
  - match: "airflow.ti.start.*.*"
    name: "airflow_task_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      status: "success"
    observer_type: histogram
  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      status: "failed"
    observer_type: histogram
  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_last_duration_seconds"
    labels:
      dag_file: "$1"
    observer_type: histogram
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"
  - match: "airflow.ti_failures"
    name: "airflow_ti_failures_total"
  - match: "airflow.ti_successes"
    name: "airflow_ti_successes_total"
